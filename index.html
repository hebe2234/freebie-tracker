];
let lang = localStorage.getItem("freebie-lang") || detectLang();
let activeCat = "us";
let state = JSON.parse(localStorage.getItem("freebie-tracker-v1") || "{}");
let custom = JSON.parse(localStorage.getItem("freebie-custom-v1") || "[]");
function detectLang(){
  const n = (navigator.language||"en").toLowerCase();
  if(n.startsWith("zh")) return "zh";
  for(const L of LANGS){ if(n.startsWith(L.id)) return L.id; }
  return "en";
}
function t(k){ return S[lang][k] || S.en[k]; }
function save(){ localStorage.setItem("freebie-lang",lang); localStorage.setItem("freebie-tracker-v1",JSON.stringify(state)); localStorage.setItem("freebie-custom-v1",JSON.stringify(custom)); }
function key(it,i){ return (it.url||"")+"|"+it.name.en+"|"+i; }
function all(){ return ITEMS.concat(custom); }
function applyLang(){
  const L = LANGS.find(x=>x.id===lang);
  document.documentElement.lang = L.html;
  document.title = t("docTitle");
  document.querySelector('meta[name="description"]').setAttribute("content", t("meta"));
  document.getElementById("h-title").textContent = t("title");
  document.getElementById("h-sub").textContent = t("sub");
  document.getElementById("tip").textContent = t("tip");
  document.getElementById("add-title").textContent = t("addTitle");
  document.getElementById("f-name").placeholder = t("ph_name");
  document.getElementById("f-url").placeholder = t("ph_url");
  document.getElementById("f-desc").placeholder = t("ph_desc");
  document.getElementById("add-btn").textContent = t("add");
  document.getElementById("f-updated").textContent = t("updated");
  document.getElementById("f-note").textContent = t("note");
  const fc = document.getElementById("f-cat");
  fc.innerHTML = '<option value="us">'+t("tab_us")+'</option><option value="tw">'+t("tab_tw")+'</option><option value="daily">'+t("tab_daily")+'</option>';
  const lb = document.getElementById("langbar"); lb.innerHTML = "";
  LANGS.forEach(L2=>{
    const b = document.createElement("button");
    b.textContent = L2.label; b.className = L2.id===lang ? "active" : "";
    b.onclick = ()=>{ lang=L2.id; save(); applyLang(); renderTabs(); renderList(); renderProgress(); };
    lb.appendChild(b);
  });
}
function renderTabs(){
  const tb = document.getElementById("tabs"); tb.innerHTML = "";
  [["us","tab_us"],["tw","tab_tw"],["daily","tab_daily"]].forEach(([c,k])=>{
    const b = document.createElement("button");
    b.textContent = t(k); b.className = c===activeCat ? "active" : "";
    b.onclick = ()=>{ activeCat=c; renderTabs(); renderList(); };
    tb.appendChild(b);
  });
}
function renderList(){
  const box = document.getElementById("list"); box.innerHTML = "";
  if(activeCat==="tw"){
    const note=document.createElement("div"); note.className="tip"; note.textContent=t("twNote");
    box.appendChild(note);
  }
  all().forEach((it,i)=>{
    if(it.cat!==activeCat) return;
    const k = key(it,i), done = !!state[k];
    const nm = it.name[lang] || it.name.en, ds = it.desc[lang] || it.desc.en;
    const d = document.createElement("div");
    d.className = "card" + (done?" done":"");
    let html = '<input type="checkbox" class="check" '+(done?"checked":"")+' aria-label="done">' +
      '<div><div class="name"><a href="'+it.url+'" target="_blank" rel="noopener">'+nm+'</a></div>' +
      '<div style="margin:.25rem 0">'+(it.tags||[]).map(tg=>'<span class="tag'+(TAGS[tg].hl?" review":"")+'">'+TAGS[tg][lang]+'</span>').join("")+'</div>' +
      '<p class="desc">'+ds+'</p></div>';
    if(it.custom) html += '<div class="actions"><button>'+t("del")+'</button></div>';
    d.innerHTML = html;
    d.querySelector(".check").onchange = e=>{ state[k]=e.target.checked; save(); renderList(); renderProgress(); };
    const delBtn = d.querySelector(".actions button");
    if(delBtn) delBtn.onclick = ()=>{ custom.splice(i-ITEMS.length,1); save(); renderList(); renderProgress(); };
    box.appendChild(d);
  });
}
function countText(done,total){
  const m = {zh:"已申請 "+done+" / "+total,en:done+" / "+total+" claimed",de:done+" / "+total+" beantragt",fr:done+" / "+total+" demandés",ja:"申請済み "+done+" / "+total,ko:"신청 완료 "+done+" / "+total,es:done+" / "+total+" solicitadas",hi:done+" / "+total+" आवेदन किए गए"};
  return m[lang]||m.en;
}
function renderProgress(){
  const items = all(), total = items.length;
  const done = items.filter((it,i)=>state[key(it,i)]).length;
  const pct = total? Math.round(done/total*100):0;
  document.getElementById("pct").textContent = pct+"%";
  document.getElementById("count").textContent = countText(done,total);
  document.getElementById("barfill").style.width = pct+"%";
}
function addCustom(){
  const name=document.getElementById("f-name").value.trim(), url=document.getElementById("f-url").value.trim()||"#",
        desc=document.getElementById("f-desc").value.trim(), cat=document.getElementById("f-cat").value;
  if(!name){ alert(t("alert")); return; }
  const nm={}, ds={};
  LANGS.forEach(L=>{ nm[L.id]=name; ds[L.id]=desc||t("newDesc"); });
  custom.push({cat:cat, url:url, tags:["new"], name:nm, desc:ds, custom:true});
  save(); activeCat=cat; renderTabs(); renderList(); renderProgress();
  document.getElementById("f-name").value=""; document.getElementById("f-url").value=""; document.getElementById("f-desc").value="";
}
applyLang(); renderTabs(); renderList(); renderProgress();
</script>
</body>
