name: Daily freebies update

on:
  schedule:
    # 08:00 America/New_York (EDT, UTC-4). Winter EST is UTC-5; close enough.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python3 .github/scripts/update_freebies.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto-freebies.json
          git diff --cached --quiet || git commit -m "auto: update freebies $(date -u +%F)"
          git push
